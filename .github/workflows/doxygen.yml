name: Generate Documentation

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем код вашего репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем официальный Doxygen напрямую из системы
      - name: Install and Run Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
          
          # Запуск сборки документации (укажите правильный путь к Doxyfile, если он не в корне)
          doxygen ./Doxyfile

      # 3. Сохраняем готовую документацию в архив артефактов
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-docs
          # Укажите папку, куда Doxygen складывает файлы (обычно html или docs/html)
          path: html/