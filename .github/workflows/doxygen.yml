name: Deploy Doxygen Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Просто устанавливаем Doxygen из встроенных пакетов Ubuntu 24.04
      - name: Install Doxygen & Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      # Очищаем старые папки, чтобы не было конфликтов путей
      - name: Clear old folders
        run: |
          rm -rf ./docs
          mkdir -p ./docs/html

      # Запуск сборки
      - name: Run Doxygen
        run: |
          doxygen ./docs/Doxyfile

      # Проверяем, появились ли сгенерированные файлы
      - name: Check generated files
        run: |
          echo "=== Список созданных файлов для сайта ==="
          ls -la ./docs/html/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Загружаем собранную папку
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4