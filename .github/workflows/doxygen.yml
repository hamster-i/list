name: Deploy Doxygen Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🛠️ ГАРАНТИРОВАННАЯ УСТАНОВКА СВЕЖЕЙ ВЕРСИИ DOXYGEN 1.12.0
      - name: Install Latest Doxygen & Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz wget
          
          # Скачиваем официальный собранный бинарник Linux x64 с релизов GitHub с флагом перенаправления
          wget -L https://github.com
          
          # Распаковываем
          tar -xzf doxygen-1.12.0.linux.bin.tar.gz
          
          # Принудительно заменяем старый системный doxygen на новый
          sudo cp doxygen-1.12.0/bin/doxygen /usr/local/bin/doxygen
          sudo ln -sf /usr/local/bin/doxygen /usr/bin/doxygen
          
          echo "=== ПРОВЕРКА ИТОГОВОЙ ВЕРСИИ ==="
          doxygen --version

      # Очищаем папки перед генерацией
      - name: Clear old folders
        run: |
          rm -rf ./docs
          mkdir -p ./docs/html

      # Запуск сборки (файл Doxyfile лежит в корне проекта)
      - name: Run Doxygen
        run: |
          doxygen ./Doxyfile

      # Проверяем файлы перед публикацией
      - name: Check generated files
        run: |
          echo "=== Список файлов для публикации ==="
          ls -la ./docs/html/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Выгружаем созданную папку напрямую на хостинг
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4