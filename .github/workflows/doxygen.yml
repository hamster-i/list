name: Deploy Doxygen Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Скачиваем официальный стабильный бинарник Doxygen
      - name: Install Latest Doxygen & Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz wget python3
          wget https://github.com
          tar -f doxygen-1.12.0.linux.bin.tar.gz -xz
          sudo cp doxygen-1.12.0/bin/doxygen /usr/local/bin/

      # 🛠️ ГАРАНТИРУЕМ, ЧТО ПАПКИ СУЩЕСТВУЮТ ПЕРЕД ЗАПУСКОМ
      - name: Prepare directories
        run: |
          mkdir -p docs
          mkdir -p docs/html

      # Запускаем сборку
      - name: Run Doxygen
        run: |
          doxygen ./Doxyfile

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4