name: Deploy Doxygen Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🛠️ ИСПОЛЬЗУЕМ СВЕЖИЙ ЭКШЕН: Он автоматически скачает актуальный Doxygen (1.12.0+)
      - name: Run Latest Doxygen
        uses: mattnotmitt/doxygen-action@edge
        with:
          doxyfile-path: './Doxyfile' # Ссылка на файл в корне репозитория

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 🛠️ ВАЖНО: Проверьте путь! Экшен mattnotmitt сохраняет html-код сайта
      # строго туда, куда указывает параметр OUTPUT_DIRECTORY внутри вашего Doxyfile.
      # Если в Doxyfile написано OUTPUT_DIRECTORY = ./docs_output, а HTML_OUTPUT = html,
      # то путь ниже должен быть 'docs_output/html'.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4