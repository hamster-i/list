name: Deploy Doxygen Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🛠️ ОБНОВЛЕНИЕ: Устанавливаем актуальный Doxygen 1.18.x через Homebrew
      - name: Install Latest Doxygen via Homebrew
        run: |
          echo "=== Установка свежей версии Doxygen ==="
          brew install doxygen
          
          # Добавляем путь Homebrew в системный PATH текущей сессии
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH

      # Устанавливаем Graphviz для отрисовки классических диаграмм
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      # Очищаем папки перед сборкой для исключения кэширования старья
      - name: Clear old folders
        run: |
          rm -rf ./docs
          mkdir -p ./docs/html

      # Запуск сборки новой версией (из PATH подхватится бинарник Homebrew)
      - name: Run Doxygen
        run: |
          echo "=== Проверяем итоговую версию Doxygen ==="
          doxygen --version
          echo "=== Запуск сборки документации ==="
          doxygen ./Doxyfile

      # Проверяем, появились ли сгенерированные файлы на диске
      - name: Check generated files
        run: |
          echo "=== Список файлов для публикации ==="
          ls -la ./docs/html/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Выгружаем созданную папку напрямую на хостинг
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4