name: Deploy Doxygen Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🛠️ СКАЧИВАНИЕ ЧЕРЕЗ CURL С ДЕКЛАРАЦИЕЙ БРАУЗЕРА
      - name: Install Latest Doxygen (1.12.0) & Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz curl
          
          # Скачиваем архив через curl, имитируя обычный браузер Chrome, чтобы обойти защиту
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -o doxygen.tar.gz \
            https://github.com
          
          # Распаковываем полученный архив
          tar -xzf doxygen.tar.gz
          
          # Заменяем старую системную версию на актуальную 1.17.0
          sudo cp doxygen-1.17.0/bin/doxygen /usr/local/bin/doxygen
          sudo ln -sf /usr/local/bin/doxygen /usr/bin/doxygen
          
          echo "=== ПРОВЕРКА ОБНОВЛЕННОЙ ВЕРСИИ ==="
          doxygen --version

      # Очищаем папки перед генерацией
      - name: Clear old folders
        run: |
          rm -rf ./docs
          mkdir -p ./docs/html

      # Запуск сборки новой версией (из корня, где лежит ваш Doxyfile)
      - name: Run Doxygen
        run: |
          doxygen ./Doxyfile

      # Проверяем файлы
      - name: Check generated files
        run: |
          echo "=== Список файлов для публикации ==="
          ls -la ./docs/html/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Выгружаем созданную папку напрямую на хостинг
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4