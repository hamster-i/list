name: Deploy Doxygen Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Устанавливаем официальный стабильный Doxygen напрямую в систему
      - name: Install Doxygen & Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      # 2. Очищаем старые папки, чтобы гарантировать запись свежих файлов
      - name: Clear old folders
        run: |
          rm -rf ./docs_output
          mkdir -p ./docs_output/html

      # 3. Запускаем сборку (файл Doxyfile лежит в корне)
      - name: Run Doxygen
        run: |
          echo "=== Проверяем версию Doxygen ==="
          doxygen --version
          echo "=== Запуск сборки документации ==="
          doxygen ./Doxyfile

      # 4. Проверяем, появились ли сгенерированные файлы на диске
      - name: Check generated files
        run: |
          echo "=== Список файлов для публикации ==="
          ls -la ./docs_output/html/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 5. Выгружаем созданную папку напрямую на хостинг
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs_output/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4