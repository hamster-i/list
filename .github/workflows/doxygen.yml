name: Deploy Doxygen Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Устанавливаем только Graphviz, а Doxygen скачиваем СВЕЖИЙ вручную
      - name: Install Latest Doxygen & Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz wget python3
          
          # Скачиваем официальный стабильный бинарник свежей версии Doxygen
          wget https://github.com
          tar -f doxygen-1.12.0.linux.bin.tar.gz -xz
          
          # Принудительно заменяем системный doxygen на новый
          sudo cp doxygen-1.12.0/bin/doxygen /usr/local/bin/doxygen
          
          # Проверяем версию в логах (должно выдать 1.12.0+)
          echo "=== ИСПОЛЬЗУЕМАЯ ВЕРСИЯ DOXYGEN ==="
          doxygen --version

      # 2. Очищаем старые папки перед сборкой, чтобы исключить кэширование старья
      - name: Clear old artifacts
        run: |
          rm -rf ./docs
          mkdir -p ./docs/html

      # 3. Запускаем сборку новой версией
      - name: Run Doxygen
        run: |
          /usr/local/bin/doxygen ./docs/Doxyfile

      # 4. Проверяем, что файлы сгенерированы именно сейчас
      - name: Check generated files
        run: |
          echo "=== Список свежих файлов ==="
          ls -la ./docs/html/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 5. Выгружаем только что созданную папку
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4