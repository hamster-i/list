name: Deploy Doxygen Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🛠️ СКАЧИВАЕМ ОФИЦИАЛЬНЫЙ БИНАРНИК С ПРАВИЛЬНОГО ЗЕРКАЛА (БЕЗ ДЕФЕКТНЫХ ССЫЛОК)
      - name: Install Latest Doxygen (1.12.0) & Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz wget
          
          # Скачиваем стабильный скомпилированный бинарник Doxygen напрямую с официального зеркала релизов
          wget https://doxygen.nl
          tar -xzf doxygen-1.12.0.linux.bin.tar.gz
          
          # Устанавливаем его в систему
          sudo cp doxygen-1.12.0/bin/doxygen /usr/local/bin/doxygen
          
          echo "=== ПРОВЕРКА ВЕРСИИ В СИСТЕМЕ ==="
          doxygen --version

      # Очищаем папки перед генерацией
      - name: Clear old folders
        run: |
          rm -rf ./docs_output
          mkdir -p ./docs_output/html

      # Запуск сборки новой версией (из корня, где лежит ваш Doxyfile)
      - name: Run Doxygen
        run: |
          doxygen ./Doxyfile

      # Проверяем файлы
      - name: Check generated files
        run: |
          echo "=== Список файлов для публикации ==="
          ls -la ./docs_output/html/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Выгружаем созданную папку напрямую на хостинг
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs_output/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4