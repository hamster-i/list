name: Deploy Doxygen Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: write # КРИТИЧНО: Экшен сам запишет файлы в ветку gh-pages
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🛠️ ИСПРАВЛЕНО: Версия экшена изменена на стабильную v2.0.0
      - name: Run Doxygen
        uses: DenverCoder1/doxygen-github-pages-action@v2.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          doxygen_version: '1.18.0'      # Скачается актуальная версия Doxygen
          config_file: './Doxyfile'      # Файл ищется строго в корне проекта
          folder: 'docs/html'     # Сюда сохранятся файлы (на основе вашего Doxyfile)

      # Проверяем, появились ли сгенерированные файлы на диске
      - name: Check generated files
        run: |
          echo "=== Список файлов для публикации ==="
          ls -la ./docs/html/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Выгружаем созданную папку напрямую на хостинг
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4