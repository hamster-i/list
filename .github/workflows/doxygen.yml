name: Deploy Doxygen Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🛠️ НАДЕЖНАЯ УСТАНОВКА СВЕЖЕГО DOXYGEN ЧЕРЕЗ SNAP (БЕЗ СКАЧИВАНИЯ АРХИВОВ)
      - name: Install Latest Doxygen via Snap & Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          
          # Устанавливаем официальный свежий Doxygen напрямую из Snap Store
          sudo snap install doxygen --classic
          
          echo "=== ПРОВЕРКА ОБНОВЛЕННОЙ ВЕРСИИ ==="
          doxygen --version

      # Очищаем папки перед генерацией
      - name: Clear old folders
        run: |
          rm -rf ./docs
          mkdir -p ./docs/html

      # Запуск сборки новой версией (из корня, где лежит ваш Doxyfile)
      - name: Run Doxygen
        run: |
          doxygen ./Doxyfile

      # Проверяем файлы
      - name: Check generated files
        run: |
          echo "=== Список файлов для публикации ==="
          ls -la ./docs/html/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Выгружаем созданную папку напрямую на хостинг
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4