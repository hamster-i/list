name: Deploy Doxygen Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🛠️ ГАРАНТИРОВАННО УСТАНАВЛИВАЕМ ПОСЛЕДНЮЮ ВЕРСИЯ DOXYGEN НАПРЯМУЮ В СИСТЕМУ
      - name: Setup Doxygen
        uses: sillelien/setup-doxygen@v2
        with:
          doxygen-version: 'latest' # Автоматически скачает самую свежую версию с GitHub

      # Устанавливаем Graphviz для отрисовки классических диаграмм связей
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      # Очищаем папки перед сборкой, чтобы избежать кэширования старья
      - name: Clear old artifacts
        run: |
          rm -rf ./docs_output
          mkdir -p ./docs_output/html

      # Запускаем сборку (теперь нативной свежей версией doxygen из системы)
      - name: Run Doxygen
        run: |
          doxygen --version # Выведет актуальную версию в логи для проверки
          doxygen ./Doxyfile

      # Проверяем, что файлы физически появились на диске
      - name: Check generated files
        run: |
          echo "=== Список свежих файлов ==="
          ls -la ./docs_output/html/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Выгружаем готовую папку
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs_output/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4