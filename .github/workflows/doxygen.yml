name: Deploy Doxygen Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: write # Требуется для записи и обновления страниц
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🛠️ ИСПОЛЬЗУЕМ ОФИЦИАЛЬНЫЙ ЭКШЕН С ЯВНЫМ УКАЗАНИЕМ АКТУАЛЬНОЙ ВЕРСИИ
      - name: Run Doxygen
        uses: DenverCoder1/doxygen-github-pages-action@v2.3.0
        with:
          doxygen_version: '1.12.0' # Указываем современную версию с поддержкой Mermaid
          config_file: './Doxyfile' # Наш файл конфигурации в корне проекта
          folder: 'docs/html' # Куда экшен принудительно сохранит результат

      # Проверяем, появились ли сгенерированные файлы на диске виртуальной машины
      - name: Check generated files
        run: |
          echo "=== Список файлов для публикации ==="
          ls -la ./docs_output/html/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Выгружаем созданную папку напрямую на хостинг
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4