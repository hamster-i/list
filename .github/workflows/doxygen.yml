name: Deploy Doxygen Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Устанавливаем Doxygen и Graphviz из официального репозитория Ubuntu
      - name: Install Doxygen & Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      # На всякий случай создаем структуру папок, чтобы исключить ошибку путей
      - name: Prepare directories
        run: |
          mkdir -p docs
          mkdir -p docs/html

      # Запуск сборки с отладочной информацией
      - name: Run Doxygen
        run: |
          echo "=== Проверяем наличие Doxyfile ==="
          ls -la ./docs/
          echo "=== Запуск сборки документации ==="
          doxygen ./docs/Doxyfile
          
      # Печатаем список сгенерированных файлов для проверки в логах
      - name: Check generated files
        run: |
          echo "=== Проверка сгенерированных файлов ==="
          ls -la ./docs_output/html/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Загрузка собранного HTML-сайта
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4